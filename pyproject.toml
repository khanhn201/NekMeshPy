[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nekmeshpy"
version = "0.1.0"
description = "Object-oriented all-hex O-grid mesher for bifurcating vessels, with Nek5000/NekRS export"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NekMeshPy contributors" }]
keywords = ["mesh", "hexahedral", "cfd", "nek5000", "nekrs", "o-grid"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.4"]
io = ["meshio>=5.0"]
test = ["pytest>=7.0"]
dev = ["ruff>=0.5", "mypy>=1.0", "pytest>=7.0"]
# gmsh is a hard import of no module -- it is deferred inside
# ``nekmeshpy.tetmesh.ops.tet_mesh``, the only function that touches it, so importing
# ``nekmeshpy`` never requires it.  ``examples/femoral.py`` is what actually calls that
# function, tet-meshing the interior of its own surface to solve conduction in the
# volume.  It is in ``all`` rather than left to the reader because
# ``tests/test_examples.py`` runs every example, and an example CI cannot run is an
# example that rots.
mesh = ["gmsh>=4.11"]
all = ["matplotlib>=3.4", "meshio>=5.0", "pytest>=7.0", "gmsh>=4.11"]
# docs also pulls in matplotlib/meshio so autodoc can import io.viz / io.export
docs = [
    "sphinx>=7",
    "myst-parser>=2",
    "furo",
    "sphinx-copybutton",
    "matplotlib>=3.4",
    "meshio>=5.0",
]

[project.urls]
Homepage = "https://github.com/khanhn201/NekMeshPy"

[tool.setuptools.packages.find]
include = ["nekmeshpy*"]

[tool.setuptools.package-data]
nekmeshpy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``femoral`` tet-meshes with gmsh and costs 316 s cold, which CI always is, so a
# default run deselects it; CI runs `pytest -m slow` once, on one interpreter, to keep
# it honest.  The chimera pair used to be here too and is now back in the default run.
addopts = "-q -m 'not slow'"
markers = [
    "slow: needs gmsh or costs minutes (femoral)",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["matlab", "tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E741",   # ambiguous variable names (l, I) -- used for meshing math
    "E501",   # line length handled by the formatter, not enforced hard
    "B905",   # zip(..., strict=) not available on py39
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
# the whole package is fully annotated and type-checked; array-valued data uses
# the dtype-parametrized aliases in ``nekmeshpy._typing`` (FloatArray / IntArray
# / BoolArray) -- a bare ``np.ndarray`` is a disallow_any_generics error.
files = ["nekmeshpy"]

# third-party packages ship no (or version-mismatched) stubs; don't analyse them
[[tool.mypy.overrides]]
module = ["numpy.*", "scipy.*", "meshio.*", "matplotlib.*"]
ignore_missing_imports = true
follow_imports = "skip"
