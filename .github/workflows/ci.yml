name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Ruff
        run: ruff check nekmeshpy tests examples
      - name: Mypy
        run: mypy

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Pytest
        run: pytest

  slow-examples:
    # The large chimera meshers (19 s / 57 s / 138 s) and femoral (316 s, cold) are
    # deselected from the default run by `addopts`, so they get one job of their own
    # rather than 4x in the matrix.
    # They are not optional: every example is a mesher, and four of them once shipped
    # broken for want of any test at all.
    name: Slow examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libGLU
        # The gmsh wheel's bundled libgmsh.so links against libGLU even when gmsh is
        # driven headlessly, and the runner image does not carry it.  Only this job
        # needs it: femoral.py is the one example that tet-meshes, and it is slow.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglu1-mesa
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Pytest (slow)
        run: pytest -m slow
